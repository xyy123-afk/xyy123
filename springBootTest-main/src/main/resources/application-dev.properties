# ===== 开发环境配置 =====
server.port=8081

# ===== MySQL 数据源 =====
# 库 xyy_login / 表 users、posts、categories、tags、post_tags、comments
# 建库建表语句见 docs/schema.sql（幂等，一键启动.bat 每次启动都会执行）
# 密码用环境变量占位符：本地没设 DB_PASSWORD 时用默认值 123456，
# 提交到 Git 也不会绑死真实密码；换环境只需设置 DB_PASSWORD 环境变量即可覆盖
spring.datasource.url=jdbc:mysql://localhost:3306/xyy_login?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JWT 登录凭证 =====
# 密钥至少 32 字节（HS256 要求）。这里给的是默认值，生产环境务必设环境变量 JWT_SECRET 覆盖
jwt.secret=${JWT_SECRET:xyy-afk-java-demo-secret-change-me-before-production}
# token 有效期（小时），过期后前端会收到"登录已过期，请重新登录"
jwt.expire-hours=24

# ===== MyBatis-Plus =====
# Mapper XML 位置：本项目的 SQL 都写在 @Select 注解里，没有 XML，
# 先配好路径，以后想写复杂 SQL 直接往 resources/mapper 下放 .xml 就能扫到
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
# 实体类别名包，XML 里写 resultType="User" 就不用带全限定名
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# 驼峰 <-> 下划线自动映射：createdAt <-> created_at
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL（开发用，上线改成注释掉或用 logging.level 控制）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键策略：数据库自增
mybatis-plus.global-config.db-config.id-type=auto

# devtools 自带的 LiveReload 服务器：前端刷新已经由 Vite 的 HMR 负责，
# 它只会抢一个随机端口（本机曾撞到 64595 导致后端起不来），直接关掉。
spring.devtools.livereload.enabled=false

# ===== 博客配置 =====
# 站长用户名：只有这个账号能进 /api/admin/**，其它账号一律 403 语义（返回 code=1）
# 换账号只改这里或设环境变量 BLOG_OWNER，不用动数据库
blog.owner-username=${BLOG_OWNER:demo001}
# 注册开关：私人聊天需要至少两个账号，开发期打开，方便注册第二个号来互发消息。
# 不希望访客注册时改回 false（登录页会自动隐藏注册入口，接口也会拒绝）。
blog.registration-enabled=true
