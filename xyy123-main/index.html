<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="枫林小筑 —— 代码、笔记与生活。一个用 Vue3 + Spring Boot 写的个人博客。" />
    <meta name="theme-color" content="#4a7af3" />
    <!-- 内联 SVG 图标，避免浏览器去请求不存在的 favicon.ico 报 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234a7af3'/%3E%3C/svg%3E" />
    <title>枫林小筑</title>
    <script>
      // 首屏前把主题写到 <html>，避免选了日间模式后刷新先闪一帧深色
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tb-theme') === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>该页面需要开启 JavaScript 才能正常运行。</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
